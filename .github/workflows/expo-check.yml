name: Expo Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Test iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist-check
